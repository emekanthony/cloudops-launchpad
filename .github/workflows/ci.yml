name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: cloudops-api:ci-${{ github.sha }}
  HELM_VERSION: v4.3.1
  TRIVY_VERSION: 0.76.0

jobs:
  lint-test:
    name: Lint & unit/API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: cloudops
          POSTGRES_DB: cloudops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudops" --health-interval 5s --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+psycopg://cloudops:cloudops@localhost:5432/cloudops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -v

  helm-lint:
    name: Helm lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint deploy/helm/cloudops --strict
      - name: Render with monitoring CRDs present
        run: helm template ci deploy/helm/cloudops --api-versions monitoring.coreos.com/v1/ServiceMonitor > rendered.yaml && grep -c '^kind:' rendered.yaml

  build-scan:
    name: Build image & Trivy scan
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t "$IMAGE" --build-arg APP_VERSION="ci-${GITHUB_SHA::7}" .
      - name: Trivy vulnerability scan (fail on fixable HIGH/CRITICAL)
        # Run Trivy from its pinned official image rather than a third-party action.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE"
      - name: Trivy config scan (Dockerfile + Helm chart misconfigurations)
        run: |
          docker run --rm -v "$PWD:/src" "aquasec/trivy:${TRIVY_VERSION}" config \
            --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Save image for the e2e job
        run: docker save "$IMAGE" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  e2e-kind:
    name: Deploy to kind + ops drills
    needs: [build-scan, helm-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Create kind cluster
        run: SKIP_MONITORING=1 scripts/cluster-up.sh
      - name: Deploy (helm --rollback-on-failure) + smoke test
        run: NO_BUILD=1 scripts/deploy.sh "ci-${GITHUB_SHA}"
      - name: Drill - failed deployment is detected and rolled back
        run: |
          scripts/break-deploy.sh
          scripts/recover.sh
      - name: Drill - backup and verified restore
        run: |
          SEED_ONLY=1 scripts/seed-and-load.sh
          scripts/backup.sh
          scripts/restore-verify.sh
          scripts/backup.sh --in-cluster
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n cloudops
          kubectl describe pods -n cloudops
          kubectl logs -n cloudops -l app.kubernetes.io/name=cloudops-api --all-containers --tail 100
          helm history cloudops -n cloudops
