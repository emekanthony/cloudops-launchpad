kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # cloudops API NodePort
        hostPort: 8080
      - containerPort: 30030   # Grafana NodePort
        hostPort: 3000
      - containerPort: 30090   # Prometheus NodePort
        hostPort: 9090
