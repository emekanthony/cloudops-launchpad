{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cloudops.secret" .) -}}
{{- $password := .Values.postgres.password -}}
{{- if not $password -}}
{{- if $existing -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudops.secret" . }}
  labels: {{- include "cloudops.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
