apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.dbHost" . }}
  labels: {{- include "cloudops.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "cloudops.dbSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cloudops.dbHost" . }}
  labels: {{- include "cloudops.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cloudops.dbHost" . }}
  replicas: 1
  selector:
    matchLabels: {{- include "cloudops.dbSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cloudops.dbSelector" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70      # the "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "cloudops.secret" . }}, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            {{- if .Values.backup.enabled }}
            # In-cluster dumps written by the backup CronJob, readable here for restores.
            - name: backups
              mountPath: /backups
              readOnly: true
            {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
    {{- if .Values.backup.enabled }}
    # Declared here rather than as a standalone PVC: with WaitForFirstConsumer storage
    # (kind, most clouds) a PVC nobody mounts stays Pending and blocks `helm --wait`.
    - metadata:
        name: backups
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.backup.storage }}
    {{- end }}
