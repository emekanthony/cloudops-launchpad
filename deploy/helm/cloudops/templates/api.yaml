apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops.name" . }}-api
  labels: {{- include "cloudops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below desired capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels: {{- include "cloudops.apiSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cloudops.apiSelector" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Retry while Postgres is still starting; give up after ~2 minutes.
          command: ["sh", "-c", "for i in $(seq 1 40); do alembic upgrade head && exit 0; sleep 3; done; exit 1"]
          env: {{- include "cloudops.dbEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env: {{- include "cloudops.dbEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.name" . }}-api
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    {{- include "cloudops.apiSelector" . | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "cloudops.apiSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.api.nodePort }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudops.name" . }}-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "cloudops.apiSelector" . | nindent 6 }}
