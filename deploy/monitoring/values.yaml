# kube-prometheus-stack overrides, tuned for a single-node kind cluster on a laptop.
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

grafana:
  adminPassword: cloudops   # local lab only
  service:
    type: NodePort
    nodePort: 30030
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # Pick up ServiceMonitors / PrometheusRules from any release, not just this chart's.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

# kind's control-plane components don't expose metrics on reachable addresses.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
